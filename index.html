<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>幸運數字卦計算器</title>
    <style>
        :root {
            --bg-color: #f7f9fc;
            --card-bg: #ffffff;
            --text-main: #2c3e50;
            --border-color: #e2e8f0;
            --primary-color: #3182ce;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 850px;
            width: 100%;
            background: var(--card-bg);
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
        }

        h1 {
            text-align: center;
            font-size: 1.8rem;
            margin-bottom: 5px;
            color: #1a202c;
        }

        .subtitle {
            text-align: center;
            color: #718096;
            font-size: 0.95rem;
            margin-bottom: 30px;
        }

        .input-section {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 30px;
        }

        .input-group {
            display: flex;
            gap: 10px;
        }

        input[type="text"] {
            flex: 1;
            padding: 14px;
            font-size: 1.2rem;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            outline: none;
            letter-spacing: 2px;
            font-weight: bold;
        }

        input[type="text"]:focus {
            border-color: var(--primary-color);
        }

        button {
            background-color: #2d3748;
            color: white;
            border: none;
            padding: 0 30px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #1a202c;
        }

        /* 結果清單區域 */
        .results-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-top: 25px;
        }

        .combination-row {
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            background: #fff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.01);
        }

        .row-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px dashed var(--border-color);
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        .sub-num {
            font-size: 1.4rem;
            font-weight: bold;
            color: var(--primary-color);
            font-family: monospace;
            letter-spacing: 1px;
        }

        .origin-hint {
            font-size: 0.85rem;
            color: #a0aec0;
            font-weight: normal;
            margin-left: 10px;
            text-decoration: line-through;
        }

        .split-detail {
            font-size: 0.9rem;
            color: #4a5568;
        }

        .split-detail strong {
            color: #1a202c;
            background: #f7fafc;
            padding: 2px 6px;
            border-radius: 4px;
            border: 1px solid #e2e8f0;
        }

        .gua-display-box {
            display: flex;
            gap: 25px;
            align-items: center;
        }

        .color-indicator {
            width: 8px;
            align-self: stroke;
            min-height: 90px;
            border-radius: 4px;
        }
        .indicator-紅色 { background-color: #e53e3e; }
        .indicator-黑色 { background-color: #1a202c; }
        .indicator-藍色 { background-color: #3182ce; }

        .iching-diagram {
            display: flex;
            flex-direction: column-reverse; /* 由下往上畫 */
            gap: 5px;
            width: 90px;
            background: #f7fafc;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #e2e8f0;
        }

        .line-bar {
            height: 8px;
            width: 100%;
        }
        .yang-bar {
            background-color: #2d3748;
        }
        .yin-bar {
            display: flex;
            justify-content: space-between;
        }
        .yin-bar::before, .yin-bar::after {
            content: '';
            width: 42%;
            height: 100%;
            background-color: #2d3748;
        }

        .gua-info-body {
            flex: 1;
        }

        .gua-meta-title {
            font-size: 1.3rem;
            font-weight: bold;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .badge {
            font-size: 0.8rem;
            padding: 3px 10px;
            border-radius: 20px;
            color: white;
            font-weight: 600;
        }
        .badge-紅色 { background-color: #e53e3e; }
        .badge-黑色 { background-color: #1a202c; }
        .badge-藍色 { background-color: #3182ce; }

        .wuxing-tag {
            font-size: 0.85rem;
            color: #718096;
            font-weight: normal;
        }

        .gua-commentary {
            font-size: 1rem;
            color: #4a5568;
            line-height: 1.6;
            background: #fcfcfc;
            padding: 12px 15px;
            border-radius: 8px;
            border-left: 3px solid #cbd5e0;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>多維幸運數字六十四卦計算器</h1>
    <div class="subtitle">自動依長度 2~20 位遞增切割：移除首尾零後若組合重複，自動進行過濾僅顯示唯一結果</div>
    
    <div class="input-section">
        <div class="input-group">
            <input type="text" id="multi-digit-input" placeholder="請輸入數字串" value="1234567" autocomplete="off">
            <button id="analyse-btn">分析所有組合</button>
        </div>
    </div>

    <div class="results-list" id="output-list"></div>
</div>

<script>

        "45": { seq: 32, name: "恆", wuxing: "木", color: "紅色", exp: "恆卦，代表恆久長遠" },
        "46": { seq: 40, name: "解", wuxing: "木", color: "黑色", exp: "解除，解決事情，病人出此卦代表沒大事" },
        "47": { seq: 62, name: "小過", wuxing: "金", color: "黑色", exp: "小過錯，有一點遲疑，要專心" },
        "48": { seq: 16, name: "豫", wuxing: "木", color: "紅色", exp: "和諧，做生意代表好卦" },
        "51": { seq: 9,  name: "小畜", wuxing: "木", color: "紅色", exp: "小收穫，做生意代表好卦" },
        "52": { seq: 61, name: "中孚", wuxing: "木", color: "黑色", exp: "有誠意及專注就能成功" },
        "53": { seq: 37, name: "家人", wuxing: "木", color: "紅色", exp: "非常好卦，代表一團和氣" },
        "54": { seq: 42, name: "益", wuxing: "木", color: "紅色", exp: "做生意代表人氣匯聚" },
        "55": { seq: 57, name: "巽", wuxing: "木", color: "黑色", exp: "不實在，最終無成果" },

        "72": { seq: 41, name: "損", wuxing: "土", color: "藍色", exp: "先短期付出才會有成果" },

        "76": { seq: 4,  name: "蒙", wuxing: "火", color: "紅色", exp: "萌芽時期，循序漸進便會好，學習發展的非常好卦" },

        "82": { seq: 19, name: "臨", wuxing: "土", color: "黑色", exp: "凡事需親力親為" },

        "84": { seq: 24, name: "復", wuxing: "土", color: "紅色", exp: "先經歷低谷，之後有好發展" },
        "85": { seq: 46, name: "升", wuxing: "木", color: "紅色", exp: "一步步往上升" },
        "86": { seq: 7,  name: "師", wuxing: "水", color: "藍色", exp: "爭門 - 生意、思想及駕馭" },
        "87": { seq: 15, name: "謙", wuxing: "金", color: "紅色", exp: "非常好卦，財運最好" },
        "88": { seq: 3,  name: "坤", wuxing: "土", color: "藍色", exp: "效率慢，什麼事都成不了" }

    const trigramLines = { 1: "111", 2: "011", 3: "101", 4: "001", 5: "110", 6: "010", 7: "100", 8: "000" };

    document.getElementById('analyse-btn').addEventListener('click', parseAllCombinations);
    parseAllCombinations(); 

    // 各個位數相加，大於 8 則持續減 8 的演算法
    function calculateGuaFromDigits(digitStr) {
        if (!digitStr) return 8; 
        let sum = 0;
        for (let i = 0; i < digitStr.length; i++) {
            sum += parseInt(digitStr.charAt(i));
        }
        while (sum > 8) {
            sum -= 8;
        }
        return sum || 8; 
    }

    function parseAllCombinations() {
        const inputStr = document.getElementById('multi-digit-input').value.trim().replace(/\D/g, '');
        const outputList = document.getElementById('output-list');
        outputList.innerHTML = ''; 

        if (inputStr.length < 2) return;

        const maxLen = Math.min(inputStr.length, 20);

        // 用來追蹤和排除重複的 Set
        const displayedCombinations = new Set();

        for (let len = 2; len <= maxLen; len++) {
            const originalSubStr = inputStr.substring(inputStr.length - len);

            // 核心清洗：移除開頭與結尾的所有零
            let subStr = originalSubStr.replace(/^0+/, '').replace(/0+$/, '');

            // 排除清洗過後長度不足或為空的組合
            if (subStr.length < 1) continue;

            // 【新優化邏輯】：如果這個清洗過後的有效數字串已經在 Set 中，代表重複，直接跳過不顯示
            if (displayedCombinations.has(subStr)) {
                continue;
            }
            // 首次遇見，將其加入紀錄
            displayedCombinations.add(subStr);

            // 奇數長度上少下多切分
            const splitPos = Math.floor(subStr.length / 2);
            const upperDigits = subStr.substring(0, splitPos);
            const lowerDigits = subStr.substring(splitPos);

            // 計算上下卦段結果
            const upperMod = calculateGuaFromDigits(upperDigits);
            const lowerMod = calculateGuaFromDigits(lowerDigits);

            const lookupKey = `${upperMod}${lowerMod}`;
            const matchedGua = luckyGuaDatabase[lookupKey];

            const rowDiv = document.createElement('div');
            rowDiv.className = 'combination-row';

            const hasZeroTrimmed = (originalSubStr !== subStr);
            const headerDiv = document.createElement('div');
            headerDiv.className = 'row-header';
            headerDiv.innerHTML = `
                <div class="sub-num">
                    ${subStr} 
                    ${hasZeroTrimmed ? `<span class="origin-hint">(原組合: ${originalSubStr})</span>` : ''}
                </div>
                <div class="split-detail">
                    上卦段: <strong>${upperDigits || '無'}</strong> (結果: ${upperMod}) | 
                    下卦段: <strong>${lowerDigits}</strong> (結果: ${lowerMod})
                </div>
            `;
            rowDiv.appendChild(headerDiv);

            const guaBox = document.createElement('div');
            guaBox.className = 'gua-display-box';

            if (matchedGua) {
                const fullHexBinary = trigramLines[lowerMod] + trigramLines[upperMod]; 
                let diagramHtml = '<div class="iching-diagram">';
                for (let bit of fullHexBinary) {
                    diagramHtml += `<div class="${bit === '1' ? 'line-bar yang-bar' : 'line-bar yin-bar'}"></div>`;
                }
                diagramHtml += '</div>';

                guaBox.innerHTML = `
                    <div class="color-indicator indicator-${matchedGua.color}"></div>
                    ${diagramHtml}
                    <div class="gua-info-body">
                        <div class="gua-meta-title">
                            ${matchedGua.name}卦
                            <span class="badge badge-${matchedGua.color}">${matchedGua.color}</span>
                            <span class="wuxing-tag">【第 ${matchedGua.seq} 卦 · 五行: ${matchedGua.wuxing} · 代碼: ${lookupKey}】</span>
                        </div>
                        <div class="gua-commentary">${matchedGua.exp}</div>
                    </div>
                `;
            } else {
                guaBox.innerHTML = `
                    <div class="color-indicator" style="background:#cbd5e0;"></div>
                    <div class="gua-info-body"><div class="gua-meta-title" style="color:#718096;">未定義代碼 (${lookupKey})</div></div>
                `;
            }

            rowDiv.appendChild(guaBox);
            outputList.appendChild(rowDiv);
        }
    }
</script>
</body>
</html>
