<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>多維幸運數字六十四卦計算器 (精準位數相加版)</title>
    <style>
        :root {
            --bg-color: #f7f9fc;
            --card-bg: #ffffff;
            --text-main: #2c3e50;
            --border-color: #e2e8f0;
            --primary-color: #3182ce;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 850px;
            width: 100%;
            background: var(--card-bg);
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
        }

        h1 {
            text-align: center;
            font-size: 1.8rem;
            margin-bottom: 5px;
            color: #1a202c;
        }

        .subtitle {
            text-align: center;
            color: #718096;
            font-size: 0.95rem;
            margin-bottom: 30px;
        }

        .input-section {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 30px;
        }

        .input-group {
            display: flex;
            gap: 10px;
        }

        input[type="text"] {
            flex: 1;
            padding: 14px;
            font-size: 1.2rem;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            outline: none;
            letter-spacing: 2px;
            font-weight: bold;
        }

        input[type="text"]:focus {
            border-color: var(--primary-color);
        }

        button {
            background-color: #2d3748;
            color: white;
            border: none;
            padding: 0 30px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #1a202c;
        }

        /* 結果清單區域 */
        .results-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-top: 25px;
        }

        .combination-row {
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            background: #fff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.01);
        }

        .row-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px dashed var(--border-color);
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        .sub-num {
            font-size: 1.4rem;
            font-weight: bold;
            color: var(--primary-color);
            font-family: monospace;
            letter-spacing: 1px;
        }

        .split-detail {
            font-size: 0.9rem;
            color: #4a5568;
        }

        .split-detail strong {
            color: #1a202c;
            background: #f7fafc;
            padding: 2px 6px;
            border-radius: 4px;
            border: 1px solid #e2e8f0;
        }

        .gua-display-box {
            display: flex;
            gap: 25px;
            align-items: center;
        }

        .color-indicator {
            width: 8px;
            align-self: stroke;
            min-height: 90px;
            border-radius: 4px;
        }
        .indicator-紅色 { background-color: #e53e3e; }
        .indicator-黑色 { background-color: #1a202c; }
        .indicator-藍色 { background-color: #3182ce; }

        .iching-diagram {
            display: flex;
            flex-direction: column-reverse; /* 由下往上畫 */
            gap: 5px;
            width: 90px;
            background: #f7fafc;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #e2e8f0;
        }

        .line-bar {
            height: 8px;
            width: 100%;
        }
        .yang-bar {
            background-color: #2d3748;
        }
        .yin-bar {
            display: flex;
            justify-content: space-between;
        }
        .yin-bar::before, .yin-bar::after {
            content: '';
            width: 42%;
            height: 100%;
            background-color: #2d3748;
        }

        .gua-info-body {
            flex: 1;
        }

        .gua-meta-title {
            font-size: 1.3rem;
            font-weight: bold;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .badge {
            font-size: 0.8rem;
            padding: 3px 10px;
            border-radius: 20px;
            color: white;
            font-weight: 600;
        }
        .badge-紅色 { background-color: #e53e3e; }
        .badge-黑色 { background-color: #1a202c; }
        .badge-藍色 { background-color: #3182ce; }

        .wuxing-tag {
            font-size: 0.85rem;
            color: #718096;
            font-weight: normal;
        }

        .gua-commentary {
            font-size: 1rem;
            color: #4a5568;
            line-height: 1.6;
            background: #fcfcfc;
            padding: 12px 15px;
            border-radius: 8px;
            border-left: 3px solid #cbd5e0;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>多維幸運數字六十四卦計算器</h1>
    <div class="subtitle">自動依長度 2~20 位遞增切割：奇數長度上卦少 1 碼、下卦多 1 碼；每個區塊獨立執行「位數相加，大於8則持續減8」算法</div>
    
    <div class="input-section">
        <div class="input-group">
            <input type="text" id="multi-digit-input" placeholder="請輸入 2 至 20 位的純數字" value="1234567" autocomplete="off">
            <button id="analyse-btn">分析所有組合</button>
        </div>
    </div>

    <div class="results-list" id="output-list"></div>
</div>
