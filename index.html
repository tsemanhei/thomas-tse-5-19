<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>多維幸運數字六十四卦計算器</title>
    <style>
        :root {
            --bg-color: #f7f9fc;
            --card-bg: #ffffff;
            --text-main: #2c3e50;
            --border-color: #e2e8f0;
            --primary-color: #3182ce;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 800px;
            width: 100%;
            background: var(--card-bg);
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
        }

        h1 {
            text-align: center;
            font-size: 1.8rem;
            margin-bottom: 5px;
            color: #1a202c;
        }

        .subtitle {
            text-align: center;
            color: #718096;
            font-size: 0.95rem;
            margin-bottom: 30px;
        }

        .input-section {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 30px;
        }

        .input-group {
            display: flex;
            gap: 10px;
        }

        input[type="text"] {
            flex: 1;
            padding: 14px;
            font-size: 1.2rem;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            outline: none;
            letter-spacing: 1px;
        }

        input[type="text"]:focus {
            border-color: var(--primary-color);
        }

        button {
            background-color: #2d3748;
            color: white;
            border: none;
            padding: 0 30px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #1a202c;
        }

        .example-hint {
            font-size: 0.9rem;
            color: #718096;
            background: #edf2f7;
            padding: 10px 15px;
            border-radius: 6px;
            line-height: 1.5;
        }

        /* 結果清單區域 */
        .results-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-top: 25px;
        }

        .combination-row {
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            background: #fff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }

        .row-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px dashed var(--border-color);
            padding-bottom: 10px;
            margin-bottom: 12px;
        }

        .sub-num {
            font-size: 1.3rem;
            font-weight: bold;
            color: var(--primary-color);
            font-family: monospace;
        }

        .split-detail {
            font-size: 0.95rem;
            color: #4a5568;
        }

        .split-detail strong {
            color: #2d3748;
        }

        .gua-display-box {
            display: flex;
            gap: 15px;
            align-items: stretch;
            margin-top: 10px;
        }

        /* 動態顏色邊框標籤 */
        .color-indicator {
            width: 8px;
            border-radius: 4px;
        }
        .indicator-紅色 { background-color: #e53e3e; }
        .indicator-黑色 { background-color: #1a202c; }
        .indicator-藍色 { background-color: #3182ce; }

        .gua-info-body {
            flex: 1;
        }

        .gua-meta-title {
            font-size: 1.25rem;
            font-weight: bold;
            margin-bottom: 6px;
        }

        .badge {
            font-size: 0.8rem;
            padding: 2px 8px;
            border-radius: 4px;
            color: white;
            margin-left: 6px;
            font-weight: normal;
            vertical-align: middle;
        }
        .badge-紅色 { background-color: #e53e3e; }
        .badge-黑色 { background-color: #1a202c; }
        .badge-藍色 { background-color: #3182ce; }

        .wuxing-tag {
            font-size: 0.85rem;
            color: #718096;
            margin-left: 10px;
        }

        .gua-commentary {
            font-size: 1rem;
            color: #4a5568;
            line-height: 1.5;
            background: #f7fafc;
            padding: 10px 12px;
            border-radius: 6px;
            margin-top: 5px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>多維幸運數字六十四卦計算器</h1>
    <div class="subtitle">依長度遞增自動切割：奇數長度上卦少1碼、下卦多1碼；偶數長度均分</div>
    
    <div class="input-section">
        <div class="input-group">
            <input type="text" id="multi-digit-input" placeholder="請輸入 2 至 20 位的純數字" value="1234567" autocomplete="off">
            <button id="analyse-btn">分析所有組合</button>
        </div>
        <div class="example-hint">
            💡 <strong>範例效果：</strong>輸入 <code>1234567</code>，系統將會由後往前自動解析長度為 2 至 7 的子組合（如：67、567、4567... 依此類推），並精準套用您的「工作表檔案 幸運數字」對應資料庫！
        </div>
    </div>

    <!-- 所有卦象解析結果的輸出貨架 -->
    <div class="results-list" id="output-list"></div>
</div>

        "46": { seq: 40, name: "解", wuxing: "木", color: "黑色", exp: "解除，解決事情，病人出此卦代表沒大事" },[cite: 1]
        "47": { seq: 62, name: "小過", wuxing: "金", color: "黑色", exp: "小過錯，有一點遲疑，要專心" },
        "48": { seq: 16, name: "豫", wuxing: "木", color: "紅色", exp: "和諧，做生意代表好卦" },
        "51": { seq: 9,  name: "小畜", wuxing: "木", color: "紅色", exp: "小收穫，做生意代表好卦" },[cite: 1]
        "52": { seq: 61, name: "中孚", wuxing: "木", color: "黑色", exp: "有誠意及專注就能成功" },

        "54": { seq: 42, name: "益", wuxing: "木", color: "紅色", exp: "做生意代表人氣匯聚" },
        "55": { seq: 57, name: "巽", wuxing: "木", color: "黑色", exp: "不實在，最終無成果" },

        "76": { seq: 4,  name: "蒙", wuxing: "火", color: "紅色", exp: "萌芽時期，循序漸進便會好，學習發展的非常好卦" },

        "86": { seq: 7,  name: "師", wuxing: "水", color: "藍色", exp: "爭門 - 生意、思想及駕馭" },
        "87": { seq: 15, name: "謙", wuxing: "金", color: "紅色", exp: "非常好卦，財運最好" },

    document.getElementById('analyse-btn').addEventListener('click', parseAllCombinations);

    // 初始化時自動跑一次預設值
    parseAllCombinations();

    function parseAllCombinations() {
        const inputStr = document.getElementById('multi-digit-input').value.trim().replace(/\D/g, '');
        const outputList = document.getElementById('output-list');
        outputList.innerHTML = ''; // 清空舊畫面

        if (inputStr.length < 2) {
            alert('請輸入長度大於或等於 2 位的數字串！');
            return;
        }

        const maxLen = Math.min(inputStr.length, 20);

        // 由長度 2 逐漸推進到完整長度 (或上限 20 碼)
        for (let len = 2; len <= maxLen; len++) {
            // 從原始字串的尾端往前擷取對應長度的子字串
            const subStr = inputStr.substring(inputStr.length - len);

            // 精準對切邏輯：比照範例 7 碼時，上卦 3 碼 (123)、下卦 4 碼 (4567)
            // 即奇數長度時：上半部無條件捨去 Math.floor() 得到較短長度，下半部拿剩餘較長長度
            const splitPos = Math.floor(subStr.length / 2);
            const upperDigits = subStr.substring(0, splitPos);
            const lowerDigits = subStr.substring(splitPos);

            // 將上卦與下卦的整數值除以 8 求餘數 (若整除餘 0 則視為 8)
            const upperMod = (parseInt(upperDigits) % 8) || 8;
            const lowerMod = (parseInt(lowerDigits) % 8) || 8;

            // 結合成主鍵代碼
            const lookupKey = `${upperMod}${lowerMod}`;
            const matchedGua = luckyGuaDatabase[lookupKey];

            // 建立前端 DOM 結構
            const rowDiv = document.createElement('div');
            rowDiv.className = 'combination-row';

            // 標題與切分說明
            const headerDiv = document.createElement('div');
            headerDiv.className = 'row-header';
            headerDiv.innerHTML = `
                <div class="sub-num">${subStr}</div>
                <div class="split-detail">
                    上卦數字: <strong>${upperDigits}</strong> ➔ (餘數: ${upperMod}) | 
                    下卦數字: <strong>${lowerDigits}</strong> ➔ (餘數: ${lowerMod})
                </div>
            `;
            rowDiv.appendChild(headerDiv);

            // 卦象結果卡片
            const guaBox = document.createElement('div');
            guaBox.className = 'gua-display-box';

            if (matchedGua) {
                guaBox.innerHTML = `
                    <div class="color-indicator indicator-${matchedGua.color}"></div>
                    <div class="gua-info-body">
                        <div class="gua-meta-title">
                            ${matchedGua.name}卦 
                            <span class="badge badge-${matchedGua.color}">${matchedGua.color}</span>
                            <span class="wuxing-tag">五行：${matchedGua.wuxing} (代碼: ${lookupKey})</span>
                        </div>
                        <div class="gua-commentary">${matchedGua.exp}</div>
                    </div>
                `;
            } else {
                guaBox.innerHTML = `
                    <div class="color-indicator" style="background:#cbd5e0;"></div>
                    <div class="gua-info-body">
                        <div class="gua-meta-title" style="color:#718096;">未定義代碼 (${lookupKey})</div>
                        <div class="gua-commentary">資料庫中無此對應數據。</div>
                    </div>
                `;
            }

            rowDiv.appendChild(guaBox);
            outputList.appendChild(rowDiv);
        }
    }
</script>

</body>
</html>
